name: Build AOSP ROM

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
  
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Maximize build space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 10240
          swap-size-mb: 10240
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-postgresql: 'true'
          remove-codeql: 'true'
          remove-docker-images: 'true'

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git gnupg flex bison gperf build-essential zip curl zlib1g-dev libc6-dev libncurses5 lib32ncurses-dev x11proto-core-dev libx11-dev libreadline-dev libgl1-mesa-dev libxml2-utils xsltproc unzip bc rsync

      - name: Setup Build Environment
        run: |
          mkdir -p ~/rom
          cd ~/rom
          
          # Cấu hình Git
          git config --global user.name "Builder"
          git config --global user.email "builder@aosp.com"
          
          # Đồng bộ mã nguồn AOSP chuẩn
          repo init -u https://android.googlesource.com/platform/manifest -b android-14.0.0_r1
          repo sync -c -j4 --no-tags --no-clone-bundle --force-sync
          
          # Bắt đầu biên dịch với lunch chuẩn 64-bit
          source build/envsetup.sh
          export ALLOW_MISSING_DEPENDENCIES=true
          
          lunch aosp_arm64-userdebug
          mka bacon -j4


    
